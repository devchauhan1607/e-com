<!doctype html>
<html lang="en">
<head>

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

<body data-page="success">

    <nav class="main-nav" aria-label="Primary navigation">

      <a href="shop.html">Shop</a>
